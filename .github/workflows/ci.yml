name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    name: lint · build · unit · e2e
    # Pin 24.04: ubuntu-latest is 26.04 and Playwright 1.51 cannot install Chromium deps there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit (inventory + payment + delivery + membership + bottle tops + notifications + supabase stub)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E journey + cancel/pay-fail matrix
        run: npm run test:e2e
        env:
          CI: true
