name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    name: lint · build · unit · e2e
    # Pin 24.04: ubuntu-latest is 26.04 and Playwright 1.51 cannot install Chromium deps there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit (inventory + payment + delivery + membership + bottle tops + notifications + supabase stub)
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Port 3001 — keep :3000 free for Playwright webServer (npm run dev).
      - name: PWA install smoke (production)
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3001 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            # npm may leave next-server children; free the port for later steps
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 3001/tcp 2>/dev/null || true
            fi
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3001/ >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "next start exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/ >/dev/null
          EXPECT_SW=1 BASE_URL=http://127.0.0.1:3001 npm run test:pwa-smoke

      - name: E2E journey + cancel/pay-fail matrix
        run: npm run test:e2e
        env:
          CI: true
